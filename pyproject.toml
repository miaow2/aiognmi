[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools",
  "wheel",
]

[project]
name = "aiognmi"
description = "Async, efficient and lightweight gNMI client written in Python."
readme = "README.md"
keywords = [
  "automation",
  "network",
  "network-automation",
  "gnmi",
  "gnmi-client",
  "grpc",
  "grpc-python",
  "async",
  "python",
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Framework :: AsyncIO",
]
license = { file = "LICENSE" }
authors = [
  {email = "miaow2@yandex.ru"},
  {name = "Artem Kotik"}
]
dependencies = [
  "cryptography==49.0.0",
  "grpcio==1.81.1",
  "protobuf==6.33.6",
]
dynamic = [
  "version",
]

[project.urls]
repository = "https://github.com/miaow2/aiognmi/"
homepage = "https://github.com/miaow2/aiognmi/"

[tool.setuptools.packages]
find = {}

[tool.setuptools.dynamic]
version = { attr = "aiognmi.__version__" }

[project.optional-dependencies]
dev = [
  "grpcio-tools==1.81.1",
  "ruff==0.15.19",
]
test = [
  "pytest==9.1.1",
]
publish = [
  "build==1.2.1",
  "twine==6.1.0",
]

[tool.ruff]
exclude = ["__pycache__", "proto"]
lint.select = ["C", "E", "F", "I"]
lint.ignore = ["C901"]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
addopts = "-p no:warnings -v"
